<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Wlweb</title>

  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>

  <base href="/PWA-2026-Meza-Lobato/Unidad%204%20-%20Ejercicio%205/">

  <!-- PWA: manifest + theme + iconos -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A6E8E" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2D4761" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="W&L Web">
  <link rel="apple-touch-startup-image" href="icons/apple-touch-startup-1242x2688.png">

  <!-- Estilos del App Shell -->
  <link rel="stylesheet" href="styles/shell.css" />
  <!-- Estilos del contenido dinámico -->
  <link rel="stylesheet" href="styles/main.css" />
  <!-- Estilos del módulo education (Áreas, Disciplinas, Preguntas, Temas) -->
  <link rel="stylesheet" href="styles/education.css" />
  <!-- Estilos del módulo de tableros (TablerosView + BoardCard + TileCard) -->
  <link rel="stylesheet" href="styles/board.css" />
  <!-- Iconos Material Symbols Outlined (CDN de Google Fonts) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <!-- Fuente Jomhuria para el brand del sidebar -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jomhuria&display=swap" />
</head>
<body>

  <!-- ----------------------------------------------------------- -->
  <!-- APP SHELL: header (móvil) | sidebar (desktop) | footer (móvil). -->
  <!-- El router solo reemplaza el contenido de <main id="app">.       -->
  <!-- ----------------------------------------------------------- -->

  <header class="app-header">  <!-- Solo visible en modo móvil (<640px) -->
    <div id="app-avatar-img" role="img" aria-label="Foto de perfil"></div>
    <span id="app-user-name">Invitado</span>
    <div class="shell-actions">
      <span class="connection-status"></span>
      <button type="button" class="install-btn" aria-label="Instalar aplicación"
              title="Instalar aplicación" hidden>
        <svg class="icon" aria-hidden="true"><use href="src/assets/icons.svg#icon-download"></use></svg>
      </button>
      <button type="button" class="theme-toggle"
              aria-label="Cambiar a tema oscuro" aria-pressed="false"
              title="Cambiar a tema oscuro">
        <svg class="icon" aria-hidden="true">
          <use class="theme-icon-moon" href="src/assets/icons.svg#icon-moon"></use>
          <use class="theme-icon-sun"  href="src/assets/icons.svg#icon-sun"></use>
        </svg>
      </button>
    </div>
  </header>

  <div class="app">
    <aside class="app-sidebar">  <!-- Solo visible en modo desktop (>=640px) -->
      <div class="sidebar-brand">
        <img class="brand-logo" src="src/assets/wireladders-logo.svg" alt="" aria-hidden="true" />
        <div class="brand-text">
          <span class="brand-name">Wires&amp;Ladders</span>
          <span class="brand-tagline">PANEL EDUCATIVO</span>
        </div>
      </div>

      <nav class="app-nav">
        <a href="/PWA-2026-Meza-Lobato/Unidad%204%20-%20Ejercicio%205/" data-link>
          <svg class="icon" aria-hidden="true"><use href="src/assets/icons.svg#icon-home"></use></svg>
          Inicio
        </a>

        <div class="protected-nav" hidden>
          <a href="/PWA-2026-Meza-Lobato/Unidad%204%20-%20Ejercicio%205/editar/preguntas" data-link>
            <svg class="icon" aria-hidden="true"><use href="src/assets/icons.svg#icon-help"></use></svg>
            Preguntas
          </a>
          <a href="/PWA-2026-Meza-Lobato/Unidad%204%20-%20Ejercicio%205/editar/tableros" data-link>
            <svg class="icon" aria-hidden="true"><use href="src/assets/icons.svg#icon-dashboard"></use></svg>
            Tableros
          </a>
          <a href="/PWA-2026-Meza-Lobato/Unidad%204%20-%20Ejercicio%205/editar/grupos" data-link>
            <svg class="icon" aria-hidden="true"><use href="src/assets/icons.svg#icon-groups"></use></svg>
            Grupos
          </a>
        </div>

        <a href="/PWA-2026-Meza-Lobato/Unidad%204%20-%20Ejercicio%205/configuracion" data-link>
          <svg class="icon" aria-hidden="true"><use href="src/assets/icons.svg#icon-config"></use></svg>
          Configuración
        </a>
      </nav>

      <div class="sidebar-bottom">
        <div id="app-avatar-img" role="img" aria-label="Foto de perfil"></div>
        <span id="app-user-name">Invitado</span>
        <div class="shell-actions">
          <span class="connection-status"></span>
          <button type="button" class="install-btn" aria-label="Instalar aplicación"
                  title="Instalar aplicación" hidden>
            <svg class="icon" aria-hidden="true"><use href="src/assets/icons.svg#icon-download"></use></svg>
          </button>
          <button type="button" class="theme-toggle"
                  aria-label="Cambiar a tema oscuro" aria-pressed="false"
                  title="Cambiar a tema oscuro">
            <svg class="icon" aria-hidden="true">
              <use class="theme-icon-moon" href="src/assets/icons.svg#icon-moon"></use>
              <use class="theme-icon-sun"  href="src/assets/icons.svg#icon-sun"></use>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- El router reemplaza SOLO esto -->    
    <main id="app">  
      <div class="skeleton-card">  <!-- Skeleton inicial: mientras el router resuelve la primera vista -->
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line short"></div>
      </div>
    </main>

  </div>

  <footer class="app-footer">   <!-- Solo visible en modo móvil (<640px) -->
    <a href="/PWA-2026-Meza-Lobato/Unidad%204%20-%20Ejercicio%205/" data-link aria-label="Home" title="Home">
      <svg class="icon" aria-hidden="true"><use href="src/assets/icons.svg#icon-home"></use></svg>
    </a>
    <a class="protected-nav" hidden href="/PWA-2026-Meza-Lobato/Unidad%204%20-%20Ejercicio%205/editar" data-link aria-label="Editar" title="Editar">
      <svg class="icon" aria-hidden="true"><use href="src/assets/icons.svg#icon-edit"></use></svg>
    </a>
    <a href="/PWA-2026-Meza-Lobato/Unidad%204%20-%20Ejercicio%205/configuracion" data-link aria-label="Configuración" title="Configuración">
      <svg class="icon" aria-hidden="true"><use href="src/assets/icons.svg#icon-config"></use></svg>
    </a>
  </footer>

  <script type="module" src="src/main.js"></script>
</body>
</html>
