<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Wlweb</title>
  <link rel="icon" href="data:,">
  
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>

  <!-- Estilos del App Shell -->
  <link rel="stylesheet" href="styles/shell.css" />
  <!-- Fuente Jomhuria para el brand del sidebar -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jomhuria&display=swap" />
  <!-- Estilos del contenido dinámico -->
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>

  <!-- ----------------------------------------------------------- -->
  <!-- APP SHELL: header (móvil) | sidebar (desktop) | footer (móvil). -->
  <!-- El router solo reemplaza el contenido de <main id="app">.       -->
  <!-- ----------------------------------------------------------- -->

  <header class="app-header">  <!-- Solo visible en modo móvil (<640px) -->
    <div id="app-avatar-img" role="img" aria-label="Foto de perfil"></div>
    <span id="app-user-name">Invitado</span>
    <button type="button" class="theme-toggle"
            aria-label="Cambiar a tema oscuro" aria-pressed="false"
            title="Cambiar a tema oscuro">
      <svg class="icon" aria-hidden="true">
        <use class="theme-icon-moon" href="src/components/icons.svg#icon-moon"></use>
        <use class="theme-icon-sun"  href="src/components/icons.svg#icon-sun"></use>
      </svg>
    </button>
  </header>

  <div class="app">
    <aside class="app-sidebar">  <!-- Solo visible en modo desktop (>=640px) -->
      <div class="sidebar-brand">
        <svg class="brand-logo" viewBox="0 0 178 194" aria-hidden="true">
          <g>
            <g stroke="white" stroke-width="3">
              <polygon points="88,192 1,144 1,49 88,96" fill="#78bdf6" />
              <polygon points="88,192 176,144 176,49 88,96" fill="#78bdf6" />
              <polygon points="176,49 88,1 1,49 88,96" fill="#6599c3" />
            </g>
            <circle cx="46"  cy="42" r="8" fill="white" />
            <circle cx="71"  cy="57" r="8" fill="white" />
            <circle cx="96"  cy="70" r="8" fill="white" />
            <circle cx="80"  cy="21" r="8" fill="white" />
            <circle cx="105" cy="35" r="8" fill="white" />
            <circle cx="130" cy="48" r="8" fill="white" />
          </g>
        </svg>
        <div class="brand-text">
          <span class="brand-name">Wires&amp;Ladders</span>
          <span class="brand-tagline">PANEL EDUCATIVO</span>
        </div>
      </div>

      <nav class="app-nav">
        <a href="/PWA-2026-Meza-Lobato/Unidad%203%20-%20Ejercicio%202/" data-link>
          <svg class="icon" aria-hidden="true"><use href="src/components/icons.svg#icon-home"></use></svg>
          Inicio
        </a>

        <div class="protected-nav" hidden>
          <a href="/PWA-2026-Meza-Lobato/Unidad%203%20-%20Ejercicio%202/editar/preguntas" data-link>
            <svg class="icon" aria-hidden="true"><use href="src/components/icons.svg#icon-help"></use></svg>
            Preguntas
          </a>
          <a href="/PWA-2026-Meza-Lobato/Unidad%203%20-%20Ejercicio%202/editar/tableros" data-link>
            <svg class="icon" aria-hidden="true"><use href="src/components/icons.svg#icon-dashboard"></use></svg>
            Tableros
          </a>
          <a href="/PWA-2026-Meza-Lobato/Unidad%203%20-%20Ejercicio%202/editar/grupos" data-link>
            <svg class="icon" aria-hidden="true"><use href="src/components/icons.svg#icon-groups"></use></svg>
            Grupos
          </a>
        </div>

        <a href="/PWA-2026-Meza-Lobato/Unidad%203%20-%20Ejercicio%202/configuracion" data-link>
          <svg class="icon" aria-hidden="true"><use href="src/components/icons.svg#icon-config"></use></svg>
          Configuración
        </a>
      </nav>

      <div class="sidebar-bottom">
        <div id="app-avatar-img" role="img" aria-label="Foto de perfil"></div>
        <span id="app-user-name">Invitado</span>
        <button type="button" class="theme-toggle"
                aria-label="Cambiar a tema oscuro" aria-pressed="false"
                title="Cambiar a tema oscuro">
          <svg class="icon" aria-hidden="true">
            <use class="theme-icon-moon" href="src/components/icons.svg#icon-moon"></use>
            <use class="theme-icon-sun"  href="src/components/icons.svg#icon-sun"></use>
          </svg>
        </button>
      </div>
    </aside>

    <!-- El router reemplaza SOLO esto -->    
    <main id="app">  
      <div class="skeleton-card">  <!-- Skeleton inicial: mientras el router resuelve la primera vista -->
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line short"></div>
      </div>
    </main>

  </div>

  <footer class="app-footer">   <!-- Solo visible en modo móvil (<640px) -->
    <a href="/PWA-2026-Meza-Lobato/Unidad%203%20-%20Ejercicio%202/" data-link aria-label="Home" title="Home">
      <svg class="icon" aria-hidden="true"><use href="src/components/icons.svg#icon-home"></use></svg>
    </a>
    <a class="protected-nav" hidden href="/PWA-2026-Meza-Lobato/Unidad%203%20-%20Ejercicio%202/editar" data-link aria-label="Editar" title="Editar">
      <svg class="icon" aria-hidden="true"><use href="src/components/icons.svg#icon-edit"></use></svg>
    </a>
    <a href="/PWA-2026-Meza-Lobato/Unidad%203%20-%20Ejercicio%202/configuracion" data-link aria-label="Configuración" title="Configuración">
      <svg class="icon" aria-hidden="true"><use href="src/components/icons.svg#icon-config"></use></svg>
    </a>
  </footer>

  <script type="module" src="src/main.js"></script>
</body>
</html>
