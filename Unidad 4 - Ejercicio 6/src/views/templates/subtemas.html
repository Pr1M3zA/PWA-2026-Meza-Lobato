<div class="temas-view view-root">
  <header class="temas-header view-header">
    <div class="temas-header__text">
      <nav class="breadcrumb" aria-label="Navegación">{{breadcrumb}}</nav>
      <h1 class="view-title">Subtemas</h1>
    </div>
    <button type="button" class="temas-add-btn" id="subtemas-add-btn">Agregar +</button>
  </header>
  <p class="view-lead view-toolbar">Agrega y edita subtemas</p>
  <div id="subtopic-container" class="view-content">
    {{content}}
  </div>
  {{formModal}}
  {{confirmModal}}
</div>
