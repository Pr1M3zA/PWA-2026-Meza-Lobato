<div class="grupos-view view-root" id="groups-view">
  <div class="view-header groups-view__header">
    <div>
      <h1 class="view-title">Grupos de estudiantes</h1>
      <p class="view-lead">Administra las descripciones, integrantes y temas de tus grupos.</p>
    </div>
    <button type="button" class="modal-btn modal-btn-primary" id="groups-add-button" disabled>
      Cargando…
    </button>
  </div>

  <section class="groups-list" id="groups-list" aria-live="polite" aria-label="Mis grupos">
    <p class="group-loading" role="status">Cargando grupos…</p>
  </section>
  <p class="group-notice" id="groups-notice" role="status" hidden></p>

  <div class="modal-backdrop" id="group-form-modal" hidden>
    <article class="modal-card group-form-card" role="dialog" aria-modal="true" aria-labelledby="group-form-title">
      <button type="button" class="modal-close" id="group-form-close" aria-label="Cerrar">
        <span class="material-symbols-outlined" aria-hidden="true">close</span>
      </button>
      <p class="modal-section">Grupos de estudiantes</p>
      <h2 class="modal-card__title" id="group-form-title">Crear grupo</h2>
      <form id="group-form">
        <div class="form-field">
          <label class="form-label" for="group-title">Descripción del grupo</label>
          <input class="form-input" id="group-title" name="title" maxlength="100" required autocomplete="off">
        </div>
        <p class="modal-error" id="group-form-error" role="alert" hidden></p>
        <div class="modal-actions">
          <button type="button" class="modal-btn modal-btn-secondary" id="group-form-cancel">Cancelar</button>
          <button type="submit" class="modal-btn modal-btn-primary" id="group-save-button">Crear grupo</button>
        </div>
      </form>
    </article>
  </div>

  {{confirmModal}}
</div>
